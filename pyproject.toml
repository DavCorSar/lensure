[project]
name = "lensure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.7",
    "imagehash>=4.3.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "reedsolo>=1.7.0",
    "tk>=0.1.0",
    "typer>=0.24.1",
]

[project.scripts]
lensure = "lensure.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
